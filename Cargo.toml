[package]
name = "neon_district"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_camera",
  "bevy_color",
  "bevy_image",
  "bevy_mesh",
  "bevy_shader",
  "bevy_material",
  "bevy_light",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_anti_alias",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "default_font",
  "hdr",
  "webgl2",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Faster-to-build web profile for iterating: PROFILE=web-dev ./build_web.sh
[profile.web-dev]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
